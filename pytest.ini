[pytest]
testpaths =
    tests
    features
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --alluredir=allure-results --clean-alluredir
junit_family = xunit2
markers =
    smoke: Critical tests that validate core API functionality
    regression: Complete functional regression suite
    negative: Negative and invalid input tests
    contract: API response schema and contract validation tests
    bdd: Behavior-driven API tests
